# Builds the production image and pushes it to Artifact Registry (see docs/GOOGLE_CLOUD.md).
#
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_SITE_URL=https://YOUR_DOMAIN,_CLERK_PUBLISHABLE_KEY=pk_live_xxx,_TAG=$(git rev-parse --short HEAD)
#
# NEXT_PUBLIC_* values end up in the browser bundle, so they are build arguments.
# Secrets never go here: Cloud Run reads them from Secret Manager at runtime.
substitutions:
  _REGION: me-central2
  _REPOSITORY: scamurai
  _IMAGE: web
  _TAG: manual
  _SITE_URL: ''
  _CLERK_PUBLISHABLE_KEY: ''

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --build-arg=NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${_CLERK_PUBLISHABLE_KEY}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${_TAG}
